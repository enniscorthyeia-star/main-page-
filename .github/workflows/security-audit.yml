name: Production Security & Vulnerability Audit

on:
  push:
    branches: [ cms-dev ]
  pull_request:
    branches: [ cms-dev ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EIA Production Security & Vulnerability Suite
        run: python3 scripts/security_test_suite.py
